services:
  terraform-registry:
    image: ghcr.io/brandencobb/terraform-registry:v2.3.1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: v2.3.1
    ports:
      - "${REGISTRY_BIND:-127.0.0.1}:${REGISTRY_PORT:-5000}:8080"
    volumes:
      - registry-data:/var/lib/terraform-registry
    environment:
      BASE_URL: "${BASE_URL:-http://localhost:5000}"
      PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      RATE_LIMIT: "${RATE_LIMIT:-100}"
      RATE_WINDOW: "${RATE_WINDOW:-1m}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-500}"
      REGISTRY_API_KEY: "${REGISTRY_API_KEY:-}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  registry-data:
