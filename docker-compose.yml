services:
  terraform-registry:
    image: ghcr.io/brandencobb/terraform-registry-scanner:v2.3.1
    build:
      context: .
      dockerfile: Dockerfile.scanner
      args:
        VERSION: v2.3.1
    ports:
      - "${REGISTRY_BIND:-127.0.0.1}:${REGISTRY_PORT:-5000}:8080"
    volumes:
      - registry-data:/var/lib/terraform-registry
    environment:
      BASE_URL: "${BASE_URL:-http://localhost:5000}"
      PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      RATE_LIMIT: "${RATE_LIMIT:-100}"
      RATE_WINDOW: "${RATE_WINDOW:-1m}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-500}"
      REGISTRY_API_KEY: "${REGISTRY_API_KEY:-}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      SCANNING_ENABLED: "true"
      SCAN_MODE: "${SCAN_MODE:-quarantine}"
      SCAN_WORKERS: "${SCAN_WORKERS:-1}"
      SCAN_TIMEOUT: "${SCAN_TIMEOUT:-15m}"
      SCAN_STALE_AFTER: "${SCAN_STALE_AFTER:-168h}"
      SCAN_INTERVAL: "${SCAN_INTERVAL:-1h}"
      SCAN_MAX_REPORT_MB: "${SCAN_MAX_REPORT_MB:-10}"
      SCAN_DENY_SEVERITIES: "${SCAN_DENY_SEVERITIES:-critical,high}"
      SCAN_OFFLINE: "${SCAN_OFFLINE:-false}"
      TRIVY_PATH: /usr/local/bin/trivy
      CHECKOV_PATH: /usr/local/bin/checkov
      TRIVY_CACHE_DIR: /var/lib/terraform-registry/trivy-cache
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  registry-data:
