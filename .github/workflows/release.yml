name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: registry-server/go.sum
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag: $tag" >&2; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Test
        run: |
          test -z "$(gofmt -l registry-server cmd/tfreg)"
          (cd registry-server && go vet ./...)
          (cd cmd/tfreg && go vet ./...)
          (cd registry-server && go test -race ./...)
          (cd cmd/tfreg && go test -race ./...)
          (cd registry-server && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
          (cd cmd/tfreg && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
          (cd registry-server && go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 ./...)
          (cd cmd/tfreg && go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 ./...)
      - name: Build directly runnable binaries and archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            for app in terraform-registry tfreg; do
              if [ "$app" = terraform-registry ]; then dir=registry-server; else dir=cmd/tfreg; fi
              output="${app}-${os}-${arch}${ext}"
              (cd "$dir" && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags="-w -s -X main.version=v${{ steps.version.outputs.version }}" -o "$GITHUB_WORKSPACE/dist/$output" .)
              if [ "$os" = windows ]; then
                (cd dist && zip "${app}-${os}-${arch}.zip" "$output")
              else
                (cd dist && tar czf "${app}-${os}-${arch}.tar.gz" "$output")
              fi
            done
          done
          (cd dist && sha256sum -- ./* > checksums.txt)
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Scanner Docker metadata
        id: scanner-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}-scanner
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
      - name: Build and push scanner-enabled image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.scanner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.scanner-meta.outputs.tags }}
          labels: ${{ steps.scanner-meta.outputs.labels }}
          build-args: VERSION=v${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=scanner
          cache-to: type=gha,mode=max,scope=scanner
          provenance: true
          sbom: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
