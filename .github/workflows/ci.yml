name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0
          working-directory: registry-server
          args: --timeout=5m

      - name: Check Go formatting
        working-directory: registry-server
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go files not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download dependencies
        working-directory: registry-server
        run: go mod download

      - name: Run unit tests
        working-directory: registry-server
        env:
          SKIP_STORAGE_INIT: "true"
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./registry-server/coverage.out
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binary
        working-directory: registry-server
        run: |
          CGO_ENABLED=0 go build -v \
            -ldflags="-w -s" \
            -o terraform-registry \
            main.go storage.go

      - name: Test binary
        working-directory: registry-server
        run: |
          ./terraform-registry --version || echo "Binary built successfully"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./registry-server
          file: ./registry-server/Dockerfile
          tags: terraform-registry:test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./registry-server
          file: ./registry-server/Dockerfile
          tags: terraform-registry:test
          load: true

      - name: Start registry
        run: |
          docker run -d \
            --name terraform-registry \
            -p 5000:8080 \
            -v $(pwd)/test-data:/var/lib/terraform-registry \
            -e STORAGE_TYPE=filesystem \
            -e BASE_URL=http://localhost:5000 \
            terraform-registry:test

          # Wait for registry to be ready
          timeout 30 bash -c 'until curl -f http://localhost:5000/health; do sleep 1; done'

      - name: Test well-known endpoint
        run: |
          curl -f http://localhost:5000/.well-known/terraform.json
          curl -s http://localhost:5000/.well-known/terraform.json | jq -e '."providers.v1"'

      - name: Upload test provider
        run: |
          # Create dummy provider binary
          mkdir -p test-files
          echo "test" > test-files/terraform-provider-test_v1.0.0_x5

          # Upload provider
          ./scripts/upload-provider.sh \
            --storage filesystem \
            --path ./test-data \
            --namespace test \
            --name example \
            --version 1.0.0 \
            --binary test-files/terraform-provider-test_v1.0.0_x5

      - name: Test provider endpoint
        run: |
          curl -f http://localhost:5000/v1/providers/test/example/versions
          curl -s http://localhost:5000/v1/providers/test/example/versions | jq -e '.versions[0].version == "1.0.0"'

      - name: Upload test module
        run: |
          # Create dummy module
          mkdir -p test-module
          cat > test-module/main.tf <<EOF
          variable "test" {
            type = string
          }
          output "test" {
            value = var.test
          }
          EOF

          # Upload module
          ./scripts/upload-module.sh \
            --storage filesystem \
            --path ./test-data \
            --namespace test \
            --name vpc \
            --provider aws \
            --version 1.0.0 \
            --source test-module/

      - name: Test module endpoint
        run: |
          curl -f http://localhost:5000/v1/modules/test/vpc/aws/versions
          curl -s http://localhost:5000/v1/modules/test/vpc/aws/versions | jq -e '.modules[0].version == "1.0.0"'

      - name: Show logs on failure
        if: failure()
        run: docker logs terraform-registry

      - name: Cleanup
        if: always()
        run: docker stop terraform-registry || true
