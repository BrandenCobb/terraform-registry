name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  lint-test-build:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            registry-server/go.sum
            cmd/tfreg/go.mod
      - name: Formatting
        run: test -z "$(gofmt -s -l registry-server cmd/tfreg)"
      - name: Server checks
        working-directory: registry-server
        run: go vet ./... && go test -race -coverprofile=coverage.out -covermode=atomic ./... && go build -trimpath .
      - name: CLI checks
        working-directory: cmd/tfreg
        run: go vet ./... && go test -race ./... && go build -trimpath .
      - name: Makefile build
        run: make build VERSION=ci
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: './scripts'

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: registry-server/go.sum
      - name: Vulnerability scan
        run: |
          (cd registry-server && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
          (cd cmd/tfreg && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
      - name: Gosec
        run: |
          (cd registry-server && go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 ./...)
          (cd cmd/tfreg && go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 ./...)

  docker-integration:
    name: Docker and Integration
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: terraform-registry:test
          build-args: VERSION=ci
      - name: Scan image
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: terraform-registry:test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Build scanner-enabled image
        run: docker build -f Dockerfile.scanner --build-arg VERSION=ci -t terraform-registry-scanner:test .
      - name: Scan scanner-enabled image
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: terraform-registry-scanner:test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Scanner image smoke test
        run: |
          docker volume create terraform-registry-scanner-test-data
          docker run -d --name terraform-registry-scanner --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=1g,mode=1777 \
            -p 5502:8080 -v terraform-registry-scanner-test-data:/var/lib/terraform-registry \
            -e BASE_URL=http://localhost:5502 -e REGISTRY_API_KEY=scanner-secret \
            -e SCANNING_ENABLED=true -e SCAN_MODE=visibility terraform-registry-scanner:test
          timeout 45 bash -c 'until curl -fsS http://localhost:5502/api/v1/security/health | jq -e ".data.enabled and .data.ready"; do sleep 1; done'
          docker exec terraform-registry-scanner trivy --version
          docker exec terraform-registry-scanner checkov --version
          mkdir scanner-fixture
          printf '%s\n' 'resource "aws_security_group" "bad" {' ' ingress { from_port=0 to_port=0 protocol="-1" cidr_blocks=["0.0.0.0/0"] }' '}' > scanner-fixture/main.tf
          set +e
          docker run --rm --user 65534:65534 --entrypoint checkov \
            -v "$PWD/scanner-fixture:/src:ro" terraform-registry-scanner:test \
            -d /src --framework terraform -o json --quiet --compact > scanner-report.json
          code=$?
          set -e
          test "$code" = 1
          jq -e '.summary.failed > 0 and .summary.parsing_errors == 0' scanner-report.json
      - name: Start registry
        run: |
          docker volume create terraform-registry-test-data
          docker run -d --name terraform-registry -p 5000:8080 \
            -v terraform-registry-test-data:/var/lib/terraform-registry \
            -e BASE_URL=http://localhost:5000 \
            -e REGISTRY_API_KEY=integration-secret \
            -e RATE_LIMIT=10000 terraform-registry:test
          timeout 30 bash -c 'until curl -fsS http://localhost:5000/health; do sleep 1; done'
      - name: End-to-end API and CLI
        run: |
          printf '#!/bin/sh\nexit 0\n' > terraform-provider-example_v1.0.0
          chmod +x terraform-provider-example_v1.0.0
          zip provider.zip terraform-provider-example_v1.0.0
          mkdir module && printf 'variable "name" { type = string }\n' > module/main.tf
          tar czf module.tar.gz -C module .

          docker cp terraform-registry:/usr/local/bin/tfreg ./tfreg
          chmod +x ./tfreg
          TFREG_REGISTRY=http://localhost:5000 TFREG_API_KEY=integration-secret \
            ./tfreg push provider --namespace test --name example --version 1.0.0 --file provider.zip
          TFREG_REGISTRY=http://localhost:5000 TFREG_API_KEY=integration-secret \
            ./tfreg push module --namespace test --name vpc --provider aws --version 1.0.0 --file module.tar.gz
          TFREG_REGISTRY=http://localhost:5000 ./tfreg list providers
          TFREG_REGISTRY=http://localhost:5000 ./tfreg list modules
          TFREG_REGISTRY=http://localhost:5000 \
            ./tfreg pull provider --namespace test --name example --version 1.0.0 --output /tmp
          TFREG_REGISTRY=http://localhost:5000 \
            ./tfreg pull module --namespace test --name vpc --provider aws --version 1.0.0 --output /tmp

          curl -fsS http://localhost:5000/.well-known/terraform.json | jq -e '."providers.v1" and ."modules.v1"'
          curl -fsS http://localhost:5000/v1/modules/test/vpc/aws/versions | jq -e '.modules[0].versions[0].version == "1.0.0"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE http://localhost:5000/api/v1/providers/test/example/1.0.0)" = 401
          curl -fsS http://localhost:5000/ui | grep -q 'Terraform Registry'
          curl -fsS -H 'Accept: text/plain' http://localhost:5000/metrics | grep -q terraform_registry_requests_total
      - name: Logs
        if: always()
        run: docker logs terraform-registry || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f terraform-registry terraform-registry-scanner || true
          docker volume rm terraform-registry-test-data terraform-registry-scanner-test-data || true
