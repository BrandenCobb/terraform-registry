name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.0
          working-directory: registry-server
          args: --timeout=5m

      - name: Check Go formatting
        working-directory: registry-server
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go files not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download dependencies
        working-directory: registry-server
        run: go mod download

      - name: Run unit tests
        working-directory: registry-server
        env:
          SKIP_STORAGE_INIT: "true"
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: ./registry-server/coverage.out
          flags: unittests
          name: codecov-umbrella

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'

      - name: Upload Gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec-results.sarif

      - name: Run govulncheck
        working-directory: registry-server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binary
        working-directory: registry-server
        run: |
          CGO_ENABLED=0 go build -v \
            -ldflags="-w -s" \
            -o terraform-registry \
            main.go storage.go

      - name: Test binary
        working-directory: registry-server
        run: |
          ./terraform-registry --version || echo "Binary built successfully"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./registry-server
          file: ./registry-server/Dockerfile
          tags: terraform-registry:test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: terraform-registry:test
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: terraform-registry:test
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./registry-server
          file: ./registry-server/Dockerfile
          tags: terraform-registry:test
          load: true

      - name: Start registry
        run: |
          # Create test-data directory with proper permissions
          mkdir -p test-data
          chmod 777 test-data

          docker run -d \
            --name terraform-registry \
            -p 5000:8080 \
            -v $(pwd)/test-data:/var/lib/terraform-registry \
            -e STORAGE_TYPE=filesystem \
            -e BASE_URL=http://localhost:5000 \
            terraform-registry:test

          # Wait for registry to be ready
          timeout 30 bash -c 'until curl -f http://localhost:5000/health; do sleep 1; done'

      - name: Test well-known endpoint
        run: |
          curl -f http://localhost:5000/.well-known/terraform.json
          curl -s http://localhost:5000/.well-known/terraform.json | jq -e '."providers.v1"'

      - name: Check registry logs
        if: always()
        run: docker logs terraform-registry

      - name: Upload and test provider
        run: |
          # Create dummy provider binary and metadata
          mkdir -p test-data/providers/test/example/1.0.0

          # Create index.json (simple version array)
          cat > test-data/providers/test/example/index.json <<'EOF'
          {
            "versions": ["1.0.0"]
          }
          EOF

          # Create dummy provider binary
          echo "dummy provider binary" > test-data/providers/test/example/1.0.0/terraform-provider-example_v1.0.0_linux_amd64.zip

          # Calculate checksum
          SHASUM=$(sha256sum test-data/providers/test/example/1.0.0/terraform-provider-example_v1.0.0_linux_amd64.zip | cut -d' ' -f1)

          # Create platform metadata
          cat > test-data/providers/test/example/1.0.0/linux_amd64.json <<EOF
          {
            "protocols": ["5.0"],
            "os": "linux",
            "arch": "amd64",
            "filename": "terraform-provider-example_v1.0.0_linux_amd64.zip",
            "download_url": "http://localhost:5000/download/providers/test/example/1.0.0/terraform-provider-example_v1.0.0_linux_amd64.zip",
            "shasum": "$SHASUM",
            "signing_keys": {
              "gpg_public_keys": []
            }
          }
          EOF

          # Verify files were created
          ls -laR test-data/

          # Wait a moment for filesystem sync
          sleep 2

          # Check logs before test
          echo "=== Registry logs before provider test ==="
          docker logs terraform-registry

          # Test provider endpoint
          echo "=== Testing provider versions endpoint ==="
          curl -v http://localhost:5000/v1/providers/test/example/versions || true

          # Check if it returns valid JSON with version
          RESULT=$(curl -s http://localhost:5000/v1/providers/test/example/versions)
          echo "Response: $RESULT"
          echo "$RESULT" | jq -e '.versions[0].version == "1.0.0"'

      - name: Upload and test module
        run: |
          # Create dummy module
          mkdir -p test-data/modules/test/vpc/aws/1.0.0

          # Create module tarball
          mkdir -p temp-module
          cat > temp-module/main.tf <<'EOF'
          variable "test" {
            type = string
          }
          output "test" {
            value = var.test
          }
          EOF

          tar czf test-data/modules/test/vpc/aws/1.0.0/module.tar.gz -C temp-module .
          rm -rf temp-module

          # Create module index (simple version array)
          cat > test-data/modules/test/vpc/aws/index.json <<'EOF'
          {
            "versions": ["1.0.0"]
          }
          EOF

          # Test module endpoints
          curl -f http://localhost:5000/v1/modules/test/vpc/aws/versions
          curl -s http://localhost:5000/v1/modules/test/vpc/aws/versions | jq -e '.modules[0].version == "1.0.0"'

      - name: Show logs on failure
        if: failure()
        run: docker logs terraform-registry

      - name: Cleanup
        if: always()
        run: docker stop terraform-registry || true
