apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: terraform-registry
  namespace: terraform-registry
spec:
  hosts:
  - terraform-registry.internal.example.com
  gateways:
  - istio-system/internal-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: terraform-registry.terraform-registry.svc.cluster.local
        port:
          number: 80
