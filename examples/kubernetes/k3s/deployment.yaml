apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-registry
  namespace: terraform-registry
  labels:
    app: terraform-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terraform-registry
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: terraform-registry
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: terraform-registry-data
        persistentVolumeClaim:
          claimName: terraform-registry-data
      containers:
      - name: registry
        image: ghcr.io/brandencobb/terraform-registry:v2.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: BASE_URL
          value: "https://terraform-registry.internal.example.com"
        - name: REGISTRY_API_KEY
          valueFrom:
            secretKeyRef:
              name: terraform-registry-bootstrap
              key: api-key
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
          - name: terraform-registry-data
            mountPath: "/var/lib/terraform-registry"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop:
            - ALL
