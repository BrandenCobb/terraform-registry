apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-registry
  namespace: terraform-registry
  labels:
    app: terraform-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terraform-registry
  template:
    metadata:
      labels:
        app: terraform-registry
    spec:
      serviceAccountName: terraform-registry
      containers:
      - name: registry
        image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/terraform-registry:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: S3_BUCKET
          value: terraform-registry
        - name: AWS_REGION
          value: us-east-1
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop:
            - ALL
