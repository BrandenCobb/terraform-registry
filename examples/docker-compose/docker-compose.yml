services:
  registry:
    image: ghcr.io/brandencobb/terraform-registry:v2.3.1
    container_name: terraform-registry
    ports:
      - "5000:8080"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:5000}
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?set REGISTRY_API_KEY}
      PORT: "8080"
      STORAGE_PATH: /var/lib/terraform-registry
    volumes:
      - registry-data:/var/lib/terraform-registry
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  registry-data:
